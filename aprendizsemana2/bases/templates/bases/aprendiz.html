{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Aprendiz</title>

    <link rel="stylesheet" href="{% static 'bases/css/estilos.css' %}">
</head>

<body id="pagina-registro" class="pagina">

    <header id="encabezado-registro" class="encabezado">
        <h1 class="titulo-principal">Registro de Aprendiz</h1>
        <p class="descripcion-principal">Ingresa los datos para registrar un nuevo aprendiz en el sistema</p>
    </header>

    <main class="contenido">
       
        <section class="seccion seccion-formulario">
            <h2 class="titulo-seccion">Formulario de Registro</h2>

            <form method="POST" action="">
                {% csrf_token %}
                
                
                {{ form.as_p }}

                <div style="margin-top: 20px; text-align: right;">
                    
                    <button type="submit" class="btn-registrar" style="border: none; cursor: pointer; width: 100%;">
                        Guardar Aprendiz
                    </button>
                </div>
            </form>
            
            <div style="margin-top: 15px; text-align: center;">
                <a href="{% url 'bases' %}" style="color: #1e3c72; text-decoration: none; font-size: 14px; font-weight: bold;">
                    ← Volver a la pagina principal
                </a>
            </div>
        </section>
    </main>

</body>

</html>
